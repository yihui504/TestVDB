[package]
name = "TestVDB"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1"
base64 = "0.22"
chromiumoxide = "0.9.1"
clap = { version = "4.6.1", features = ["derive"] }
futures = "0.3.32"
html2md = "0.2.15"
regex = "1.12.3"
reqwest = { version = "0.13.3", features = ["json"] }
scraper = "0.26.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
toml = "0.8"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.23.1", features = ["v4", "fast-rng"] }

[dev-dependencies]
tempfile = "3.27.0"
