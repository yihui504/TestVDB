# Qdrant REST API Endpoint Registry
target = "qdrant"
version = "1.17.1"

[[endpoints]]
name = "create_collection"
api_path = "PUT /collections/{collection_name}"
docs_url = "https://qdrant.tech/documentation/concepts/collections/#create-a-collection"
category = "collection"

[[endpoints]]
name = "delete_collection"
api_path = "DELETE /collections/{collection_name}"
docs_url = "https://api.qdrant.tech/api-reference/collections/delete-collection"
category = "collection"

[[endpoints]]
name = "search_points"
api_path = "POST /collections/{collection_name}/points/search"
docs_url = "https://qdrant.tech/documentation/concepts/search/"
category = "points"

[[endpoints]]
name = "upsert_points"
api_path = "PUT /collections/{collection_name}/points"
docs_url = "https://api.qdrant.tech/api-reference/points/upsert-points"
category = "points"

[[endpoints]]
name = "scroll_points"
api_path = "POST /collections/{collection_name}/points/scroll"
docs_url = "https://qdrant.tech/documentation/manage-data/points/#scroll-points"
category = "points"

[[endpoints]]
name = "recommend_points"
api_path = "POST /collections/{collection_name}/points/recommend"
docs_url = "https://qdrant.tech/documentation/search/explore/#recommendation-api"
category = "points"
