# TestVDB Docker Compose - Milvus Standalone
# Template uses ${MILVUS_PORT:-19530} for user-customizable port
# Container names include ${TESTVDB_SESSION_ID} to avoid multi-session conflicts
# Milvus requires etcd + MinIO as dependencies
#
# Port mapping:
#   19530 - gRPC API (primary interface for pymilvus SDK)
#   9091  - REST health check / metrics
# Note: Milvus uses gRPC as its primary API; the gRPC and REST ports
# are the same (19530) because Milvus serves both on this port internally.

services:
  etcd:
    container_name: testvdb-milvus-etcd-${TESTVDB_SESSION_ID:-standalone}
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    container_name: testvdb-milvus-minio-${TESTVDB_SESSION_ID:-standalone}
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    container_name: testvdb-milvus-standalone-${TESTVDB_SESSION_ID:-standalone}
    image: milvusdb/milvus:${MILVUS_VERSION:-v2.4.0}
    # ponytail: mem_limit 防 attack-boundary 策略 6 资源极限测试 OOM 杀宿主
    mem_limit: ${TESTVDB_DB_MEM_LIMIT:-4g}
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "${MILVUS_HEALTH_PORT:-9091}:9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  etcd_data:
  minio_data:
  milvus_data:
