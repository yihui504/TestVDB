# TestVDB Docker Compose - PGVector Standalone
# Template uses ${PGVECTOR_VERSION:-pg17} for user-customizable version
# Container name includes ${TESTVDB_SESSION_ID} to avoid multi-session conflicts

services:
  pgvector:
    container_name: testvdb-pgvector-${TESTVDB_SESSION_ID:-standalone}
    image: pgvector/pgvector:${PGVECTOR_VERSION:-pg17}
    # ponytail: mem_limit 防 attack-boundary 策略 6 资源极限测试 OOM 杀宿主
    mem_limit: ${TESTVDB_DB_MEM_LIMIT:-2g}
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: testvdb
    ports:
      - "${PGVECTOR_PORT:-5432}:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d testvdb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgvector_data:
