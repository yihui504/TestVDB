# TestVDB Docker Compose - Chroma (server mode)
# Port uses ${CHROMA_PORT:-8000} for user-customizable port
# Health: /api/v2/heartbeat (200 → ready). 默认无 auth (token auth 可选，开发测试关闭).
# Chroma API: v2 tenant/database/collection 模型；v1 兼容 (/api/v1/collections).
#   向量：collection.add({ids, embeddings, documents}) → collection.query({query_embeddings}).
#
# healthcheck 用 bash /dev/tcp（chromadb/chroma:1.5.9 distroless 无 python/curl/wget，
# 但镜像内含 bash；/dev/tcp 是 bash 内建，无外部依赖）。
# docker-executor Step 1 另用主机 curl 轮询 /api/v2/heartbeat 兜底。

services:
  chroma:
    container_name: testvdb-chroma-${TESTVDB_SESSION_ID:-standalone}
    image: chromadb/chroma:${CHROMA_VERSION:-0.6.3}
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    ports:
      - "${CHROMA_PORT:-8000}:8000"
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8000' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  chroma_data:
